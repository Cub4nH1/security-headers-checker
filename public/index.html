<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔒 Security Headers Checker</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --abyss: #050507;
      --carbon: #101010;
      --charcoal: #3d3a39;
      --signal: #00d992;
      --mint: #2fd6a1;
      --snow: #f2f2f2;
      --parchment: #b8b3b0;
      --steel: #8b949e;
      --danger: #fb565b;
      --warning: #ffba00;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--abyss);
      color: var(--snow);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated Background */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.4;
    }

    /* Header */
    .header {
      position: relative;
      z-index: 10;
      background: rgba(5, 5, 7, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--charcoal);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--carbon);
      border: 2px solid var(--signal);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 0 10px rgba(0, 217, 146, 0.3);
    }

    .logo-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 600;
      color: var(--signal);
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
    }

    .nav-links a {
      color: var(--parchment);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--signal); }

    /* Main Content */
    .main {
      position: relative;
      z-index: 10;
      max-width: 900px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    /* Hero */
    .hero {
      text-align: center;
      margin-bottom: 3rem;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 1rem;
      letter-spacing: -0.5px;
    }

    .hero h1 span {
      color: var(--signal);
      text-shadow: 0 0 20px rgba(0, 217, 146, 0.5);
    }

    .hero p {
      color: var(--parchment);
      font-size: 1rem;
      max-width: 500px;
      margin: 0 auto;
    }

    /* Terminal Box */
    .terminal {
      background: var(--carbon);
      border: 1px solid var(--charcoal);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .terminal-header {
      background: rgba(61, 58, 57, 0.5);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--charcoal);
    }

    .terminal-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .terminal-dot.red { background: #ff5f56; }
    .terminal-dot.yellow { background: #ffbd2e; }
    .terminal-dot.green { background: #27c93f; }

    .terminal-title {
      margin-left: auto;
      margin-right: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--steel);
    }

    .terminal-body {
      padding: 1.5rem;
    }

    /* Search Input */
    .search-box {
      display: flex;
      gap: 0.75rem;
    }

    .search-input {
      flex: 1;
      background: var(--abyss);
      border: 1px solid var(--charcoal);
      border-radius: 6px;
      padding: 0.875rem 1rem;
      color: var(--snow);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--signal);
      box-shadow: 0 0 0 2px rgba(0, 217, 146, 0.1);
    }

    .search-input::placeholder {
      color: var(--steel);
    }

    .btn {
      background: var(--carbon);
      color: var(--mint);
      border: 1px solid var(--signal);
      border-radius: 6px;
      padding: 0.875rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      background: var(--signal);
      color: var(--abyss);
      box-shadow: 0 0 15px rgba(0, 217, 146, 0.3);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Results */
    .results { display: none; }
    .results.active { display: block; }

    /* Score Display */
    .score-section {
      text-align: center;
      padding: 2rem;
      background: var(--carbon);
      border: 1px solid var(--charcoal);
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0 auto 1rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .score-circle.A\+ { background: rgba(0, 217, 146, 0.15); color: var(--signal); box-shadow: 0 0 20px rgba(0, 217, 146, 0.3); }
    .score-circle.A { background: rgba(0, 217, 146, 0.1); color: var(--signal); }
    .score-circle.B { background: rgba(255, 186, 0, 0.15); color: var(--warning); }
    .score-circle.C { background: rgba(255, 186, 0, 0.1); color: var(--warning); }
    .score-circle.D { background: rgba(251, 86, 91, 0.1); color: var(--danger); }
    .score-circle.F { background: rgba(251, 86, 91, 0.15); color: var(--danger); }

    .score-label {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .score-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--steel);
      word-break: break-all;
    }

    /* Headers List */
    .headers-section {
      background: var(--carbon);
      border: 1px solid var(--charcoal);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .section-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-header h3 {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--parchment);
    }

    .badge {
      background: var(--abyss);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--steel);
      border: 1px solid var(--charcoal);
    }

    .header-item {
      padding: 0.875rem 1.25rem;
      border-bottom: 1px solid var(--charcoal);
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      transition: background 0.2s;
    }

    .header-item:last-child { border-bottom: none; }
    .header-item:hover { background: rgba(61, 58, 57, 0.2); }

    .status-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
      margin-top: 0.125rem;
    }

    .status-icon.present {
      background: rgba(0, 217, 146, 0.15);
      color: var(--signal);
    }

    .status-icon.missing {
      background: rgba(251, 86, 91, 0.15);
      color: var(--danger);
    }

    .header-info { flex: 1; }

    .header-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--snow);
      margin-bottom: 0.125rem;
    }

    .header-desc {
      font-size: 0.8rem;
      color: var(--parchment);
      line-height: 1.4;
    }

    .header-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--steel);
      background: var(--abyss);
      padding: 0.375rem 0.625rem;
      border-radius: 4px;
      margin-top: 0.375rem;
      display: inline-block;
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-fix {
      font-size: 0.75rem;
      color: var(--mint);
      margin-top: 0.25rem;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Loading */
    .loading {
      display: none;
      text-align: center;
      padding: 3rem;
    }

    .loading.active { display: block; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--charcoal);
      border-top-color: var(--signal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading p {
      color: var(--parchment);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
    }

    /* Error */
    .error {
      display: none;
      background: rgba(251, 86, 91, 0.1);
      border: 1px solid rgba(251, 86, 91, 0.3);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      color: var(--danger);
      margin-bottom: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
    }

    .error.active { display: block; }

    /* Footer */
    .footer {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      color: var(--steel);
      font-size: 0.85rem;
      border-top: 1px solid var(--charcoal);
      margin-top: 3rem;
    }

    .footer a {
      color: var(--signal);
      text-decoration: none;
    }

    .footer a:hover { text-decoration: underline; }

    /* Responsive */
    @media (max-width: 640px) {
      .header { padding: 1rem; flex-direction: column; gap: 1rem; }
      .hero h1 { font-size: 1.75rem; }
      .search-box { flex-direction: column; }
      .header-value { max-width: 150px; }
    }
  </style>
</head>
<body>
  <!-- Animated Background -->
  <canvas id="bg-canvas"></canvas>

  <header class="header">
    <div class="logo">
      <div class="logo-icon">🔒</div>
      <span class="logo-text">sec-headers</span>
    </div>
    <nav class="nav-links">
      <a href="https://github.com/Cub4nH1/security-headers-checker" target="_blank">GitHub</a>
    </nav>
  </header>

  <main class="main">
    <section class="hero">
      <h1>Analizza la <span>sicurezza</span> dei tuoi siti</h1>
      <p>Verifica gli header HTTP e ottieni un report dettagliato con score e raccomandazioni.</p>
    </section>

    <div class="terminal">
      <div class="terminal-header">
        <span class="terminal-dot red"></span>
        <span class="terminal-dot yellow"></span>
        <span class="terminal-dot green"></span>
        <span class="terminal-title">security-analyzer</span>
      </div>
      <div class="terminal-body">
        <div class="search-box">
          <input type="text" class="search-input" id="urlInput" placeholder="inserisci URL (es. example.com)">
          <button class="btn" id="checkBtn">
            <span>⚡</span> Analizza
          </button>
        </div>
      </div>
    </div>

    <div class="error" id="error"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>&gt; analisi in corso...</p>
    </div>

    <div class="results" id="results">
      <div class="score-section">
        <div class="score-circle" id="scoreCircle">A+</div>
        <div class="score-label" id="scoreLabel">Security Score</div>
        <div class="score-url" id="scoreUrl"></div>
      </div>

      <div class="headers-section">
        <div class="section-header">
          <h3>Header di Sicurezza</h3>
          <span class="badge" id="headerCount">0/15 presenti</span>
        </div>
        <div id="headersList"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Creato da <a href="https://github.com/Cub4nH1" target="_blank">Cub4nH1</a> • <a href="https://github.com/Cub4nH1/security-headers-checker" target="_blank">Open Source</a></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script src="app.js"></script>
  <script>
    // Animated Background - Flow Field
    const canvas = document.getElementById('bg-canvas');
    const sketch = (p) => {
      let particles = [];
      let flowField = [];
      let cols, res = 20;
      let zOff = 0;

      p.setup = () => {
        p.createCanvas(window.innerWidth, window.innerHeight);
        p.pixelDensity(1);
        cols = p.floor(p.width / res);
        let rows = p.floor(p.height / res);
        flowField = new Array(cols * rows);
        for (let i = 0; i < 300; i++) {
          particles.push(new Particle());
        }
        p.background(5, 5, 7);
      };

      p.draw = () => {
        p.background(5, 5, 7, 20);
        let yOff = 0;
        for (let y = 0; y < p.height; y += res) {
          let xOff = 0;
          for (let x = 0; x < p.width; x += res) {
            let angle = p.noise(xOff, yOff, zOff) * p.TWO_PI * 2;
            let v = p5.Vector.fromAngle(angle);
            v.setMag(0.5);
            flowField[x / res + (y / res) * cols] = v;
            xOff += 0.1;
          }
          yOff += 0.1;
        }
        zOff += 0.005;

        for (let particle of particles) {
          particle.follow(flowField);
          particle.update();
          particle.edges();
          particle.show();
        }
      };

      p.windowResized = () => {
        p.resizeCanvas(window.innerWidth, window.innerHeight);
        p.background(5, 5, 7);
      };

      class Particle {
        constructor() {
          this.pos = p.createVector(p.random(p.width), p.random(p.height));
          this.vel = p.createVector(0, 0);
          this.acc = p.createVector(0, 0);
          this.maxSpeed = 1.5;
          this.prevPos = this.pos.copy();
          this.color = p.random() > 0.7 ? '0, 217, 146' : '47, 214, 161';
        }

        follow(field) {
          let x = p.floor(this.pos.x / res);
          let y = p.floor(this.pos.y / res);
          let index = x + y * cols;
          if (field[index]) {
            let force = field[index].copy();
            this.applyForce(force);
          }
        }

        applyForce(force) { this.acc.add(force); }

        update() {
          this.vel.add(this.acc);
          this.vel.limit(this.maxSpeed);
          this.prevPos = this.pos.copy();
          this.pos.add(this.vel);
          this.acc.mult(0);
        }

        edges() {
          if (this.pos.x > p.width) { this.pos.x = 0; this.prevPos = this.pos.copy(); }
          if (this.pos.x < 0) { this.pos.x = p.width; this.prevPos = this.pos.copy(); }
          if (this.pos.y > p.height) { this.pos.y = 0; this.prevPos = this.pos.copy(); }
          if (this.pos.y < 0) { this.pos.y = p.height; this.prevPos = this.pos.copy(); }
        }

        show() {
          p.stroke(this.color, 40);
          p.strokeWeight(0.5);
          p.line(this.prevPos.x, this.prevPos.y, this.pos.x, this.pos.y);
        }
      }
    };
    new p5(sketch, canvas);
  </script>
</body>
</html>
